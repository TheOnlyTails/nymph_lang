name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Rust nightly
        run: rustup override set nightly
      - name: Set up Node
        # The codegen crate executes the JavaScript it emits under `node` as
        # part of the test suite, so `node` must be on PATH.
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build
        run: cargo build --verbose
      - name: Test
        # Keep standalone compiler sessions alive within their libtest binaries
        # while nextest runs the rest of the workspace in parallel.
        run: |
          cargo test -p nymph-compiler \
            --test arithmetic \
            --test boxing \
            --test collections \
            --test conditions \
            --test exact_integers \
            --test golden_programs \
            --test pipeline \
            --test run_node &
          libtest_pid=$!

          cargo nextest run -E \
            'not (package(nymph-compiler) &
            (binary(arithmetic) | binary(boxing) | binary(collections) |
            binary(conditions) | binary(exact_integers) | binary(golden_programs) |
            binary(pipeline) | binary(run_node)))' &
          nextest_pid=$!

          status=0
          wait "$libtest_pid" || status=$?
          wait "$nextest_pid" || status=$?
          exit "$status"
