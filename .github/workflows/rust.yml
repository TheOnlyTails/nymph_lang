name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Rust nightly
        run: rustup override set nightly
      - name: Set up Node
        # The codegen crate executes the JavaScript it emits under `node` as
        # part of the test suite, so `node` must be on PATH.
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        # `cargo binstall` is not preinstalled on the runner; install-action
        # fetches a prebuilt nextest binary directly.
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo nextest run
