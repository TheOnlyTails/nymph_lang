name: Publish VSCode Extension
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # uses version from packageManager field
        with:
          run_install: true
          package_json_file: ../package.json
      - name: Check VS Code API floor
        run: pnpm --dir .. check:vscode-api-floor
      - name: Publish
        run: pnpm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
