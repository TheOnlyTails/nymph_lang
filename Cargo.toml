[workspace]
resolver = "3"
members = [
	"crates/nymph-ast",
	"crates/nymph-diagnostics",
	"crates/nymph-syntax",
	"crates/nymph-hir",
	"crates/nymph-sema",
	# Added layer by layer as each crate is built:
	# "crates/nymph-codegen",
	# "crates/nymph-compiler",
	# "crates/nymph-cli",
	# "crates/nymph-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://nymphlang.dev/"
repository = "https://github.com/theonlytails/nymph_lang"
authors = ["Shachar Zidon <theonlytails@theonlytails.com>"]

[workspace.dependencies]
# Internal crates
nymph-ast = { path = "crates/nymph-ast" }
nymph-diagnostics = { path = "crates/nymph-diagnostics" }
nymph-syntax = { path = "crates/nymph-syntax" }
nymph-hir = { path = "crates/nymph-hir" }
nymph-sema = { path = "crates/nymph-sema" }
nymph-codegen = { path = "crates/nymph-codegen" }
nymph-compiler = { path = "crates/nymph-compiler" }

# Shared external dependencies (proven set carried over from the previous implementation)
anyhow = "1.0.103"
ariadne = "0.6.0"
chumsky = { version = "0.13.0", features = ["pratt", "memoization", "regex", "nightly"] }
clap = { version = "4.6.0", features = ["derive", "cargo"] }
ecow = "0.3.0"
ena = "0.14.3"
indexmap = "2.13.0"
itertools = "0.15.0"
ordered-float = "5.3.0"
oxc = { version = "0.138.0", features = ["codegen"] }
rayon = "1.11.0"
reedline = "0.48.0"
rustc-hash = "2.1.1"
salsa = "0.27.2"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
smol = "2.0.2"
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.0.7"
tower-lsp = { version = "0.20.0", default-features = false, features = ["runtime-agnostic"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = { version = "2.5.8", features = ["serde"] }

# Dev
assertables = "10.1.0"
glob = "0.3.3"
test-case = "3.3.1"

[profile.bench]
debug = true
