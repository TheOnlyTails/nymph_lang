[workspace]
resolver = "3"
members = [
	"crates/nymph-ast",
	"crates/nymph-diagnostics",
	"crates/nymph-errorcode",
	"crates/nymph-syntax",
	"crates/nymph-hir",
	"crates/nymph-sema",
	"crates/nymph-codegen",
	# Added layer by layer as each crate is built:
	"crates/nymph-compiler",
	"crates/nymph-project",
	"crates/nymph-cli",
	"crates/nymph-lsp",
	"crates/nymph-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://nymphlang.dev/"
repository = "https://github.com/theonlytails/nymph_lang"
authors = ["Shachar Zidon <theonlytails@theonlytails.com>"]

[workspace.dependencies]
# Internal crates
nymph-ast = { path = "crates/nymph-ast" }
nymph-diagnostics = { path = "crates/nymph-diagnostics" }
nymph-errorcode = { path = "crates/nymph-errorcode" }
nymph-syntax = { path = "crates/nymph-syntax" }
nymph-hir = { path = "crates/nymph-hir" }
nymph-sema = { path = "crates/nymph-sema" }
nymph-codegen = { path = "crates/nymph-codegen" }
nymph-compiler = { path = "crates/nymph-compiler" }
nymph-project = { path = "crates/nymph-project" }

# Shared external dependencies (proven set carried over from the previous implementation)
anyhow = "1.0.104"
ariadne = "0.6.0"
chumsky = { version = "0.13.0", features = ["pratt", "memoization", "regex", "nightly"] }
clap = { version = "4.6.2", features = ["derive", "cargo"] }
ecow = "0.3.0"
ena = "0.14.4"
indexmap = "2.14.0"
itertools = "0.15.0"
ordered-float = "5.3.0"
oxc = { version = "0.140.0", features = ["codegen", "transformer", "semantic"] }
rayon = "1.12.0"
reedline = "0.49.0"
rustc-hash = "2.1.3"
rustix = { version = "1.1.4", features = ["fs"] }
salsa = "0.28.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
smol = "2.0.2"
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.3"
tower-lsp = { version = "0.20.0", default-features = false, features = ["runtime-agnostic"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }

# Dev
assertables = "10.1.0"
glob = "0.3.3"
test-case = "3.3.1"

[profile.bench]
debug = true
