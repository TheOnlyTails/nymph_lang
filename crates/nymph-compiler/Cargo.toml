[package]
name = "nymph-compiler"
description = "The Nymph compiler pipeline: the top-level API for parsing, checking, and compiling Nymph source to JavaScript."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[features]
test-support = []

[dependencies]
nymph-syntax = { workspace = true }
nymph-sema = { workspace = true }
nymph-codegen = { workspace = true }
nymph-diagnostics = { workspace = true }
nymph-ast = { workspace = true }
nymph-hir = { workspace = true }
ecow = { workspace = true }
oxc = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
rolldown = "1.2.0"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
criterion = "0.7.0"

[lints.clippy]
all = "warn"

[[bench]]
name = "incremental_project"
harness = false
