[package]
name = "nymph-lsp"
description = "The Nymph language server (diagnostics + hover) over stdio, for the VS Code extension."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nymph-lsp"
path = "src/main.rs"

[dependencies]
nymph-compiler = { workspace = true }
nymph-project = { workspace = true }
nymph-sema = { workspace = true }
nymph-syntax = { workspace = true }
nymph-diagnostics = { workspace = true }
nymph-ast = { workspace = true }
nymph-format = { path = "../nymph-format" }
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.150"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
percent-encoding = "2.3.2"
strsim = { workspace = true }

[dev-dependencies]
nymph-compiler = { workspace = true, features = ["test-support"] }
tempfile = "3"
