[package]
name = "nymph-compiler"
description = "A simple language that gets out of your way."
version = "0.1.0"
edition = "2024"
homepage = "https://nymphlang.dev/"
repository = "https://github.com/theonlytails/nymph_lang"
license = "Apache-2.0"
authors = ["Shachar Zidon <theonlytails@theonlytails.com>"]
keywords = ["language", "programming-language", "parser", "lexer", "compiler"]
categories = ["compilers", "command-line-utilities", "parser-implementations"]

[dependencies]
anyhow = { workspace = true }
ariadne = "0.6.0"
chumsky = { version = "0.12.0", features = ["pratt", "memoization", "regex", "serde", "nightly"] }
clap = { version = "4.5.56", features = ["derive", "cargo"] }
itertools = { workspace = true }
ordered-float = "5.1.0"
salsa = "0.26.0"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.18"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reedline = "0.45.0"
ecow = "0.2.6"
regex = "1.12.2"
indexmap = "2.13.0"
vec1 = "1.12.1"

[dev-dependencies]
glob = "0.3.3"
test-case = "3.3.1"
assertables = "9.8.4"
