[package]
name = "nymph-compiler"
description = "A simple language that gets out of your way."
version = "1.0.0-alpha.0"
edition = "2024"
homepage = "https://nymphlang.dev/"
repository = "https://github.com/theonlytails/nymph_lang"
license = "Apache-2.0"
authors = ["Shachar Zidon <theonlytails@theonlytails.com>"]
keywords = ["language", "programming-language", "parser", "lexer", "compiler"]
categories = ["compilers", "command-line-utilities", "parser-implementations"]

[dependencies]
anyhow = { workspace = true }
ariadne = "0.6.0"
chumsky = { version = "0.12.0", features = [
  "pratt",
  "memoization",
  "regex",
  "serde",
  "nightly",
] }
clap = { version = "4.6.0", features = ["derive", "cargo"] }
itertools = { workspace = true }
rayon = { workspace = true }
ordered-float = "5.3.0"
oxc = { version = "0.123.0", features = ["codegen"] }
salsa = "0.26.0"
strsim = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reedline = "0.46.0"
ecow = "0.2.6"
regex = "1.12.3"
indexmap = "2.13.0"
vec1 = "1.12.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.7"
semver = { version = "1.0.27", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
glob = "0.3.3"
test-case = "3.3.1"
assertables = "9.8.6"
